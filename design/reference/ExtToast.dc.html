<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Extension: in-page notice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
button{transition:background-color .15s ease,color .15s ease,border-color .15s ease}
a{color:#C6F432}a:hover{color:#E4FF8A}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.blink{animation:blink .9s steps(2,jump-none) infinite}
.drop{animation:drop .6s cubic-bezier(.2,.7,.2,1) both}
.drain{animation:drain 6s linear infinite;transform-origin:0 50%}
@media (prefers-reduced-motion: reduce){.blink,.drop,.drain{animation:none}button{transition:none}}
</style>
</helmet>
<div style="width: 420px; height: 176px; padding: 16px; gap: 12px; box-sizing: border-box; display: flex; flex-direction: column; background: #0C0D0E; color: #F2F4F5; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums">
<div class="drop" style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 0.08em; color: #C6F432">SENT TO MBIRO</span>
<span style="font-size: 11.5px; letter-spacing: 0.08em; color: #A7ADB2">2.9 GB · 16 CONN</span>
</div>
<span style="font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">ubuntu-24.04.1-desktop-arm64.iso</span>
<div aria-hidden="true" style="height: 3px; background: #24272A"><div class="drain" style="height: 3px; background: #C6F432"></div></div>
<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="min-height: 44px; border: 1px solid #3C4044; border-radius: 2px; background: transparent; color: #F2F4F5; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; cursor: pointer">USE BROWSER INSTEAD</button>
<button style="min-height: 44px; border: 1px solid #3C4044; border-radius: 2px; background: transparent; color: #F2F4F5; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; cursor: pointer">SHOW IN MBIRO</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":176}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
