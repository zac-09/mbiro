<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Extension popup: connected</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
button{transition:background-color .15s ease,color .15s ease,border-color .15s ease}
a{color:#C6F432}a:hover{color:#E4FF8A}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.blink{animation:blink .9s steps(2,jump-none) infinite}
.drop{animation:drop .6s cubic-bezier(.2,.7,.2,1) both}
.drain{animation:drain 6s linear infinite;transform-origin:0 50%}
@media (prefers-reduced-motion: reduce){.blink,.drop,.drain{animation:none}button{transition:none}}
</style>
</helmet>
<div style="width: 340px; height: 540px; padding: 16px; gap: 14px; box-sizing: border-box; display: flex; flex-direction: column; background: #0C0D0E; color: #F2F4F5; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums">

<div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #2A2D30">
<span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.16em; color: #C6F432">MBIRO</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 11.5px; letter-spacing: 0.08em; color: #F2F4F5"><span aria-hidden="true" class="blink" style="width: 8px; height: 8px; background: #C6F432"></span>APP CONNECTED</span>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<div style="min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 21px; font-weight: 600; letter-spacing: 0.06em">CATCH DOWNLOADS</span>
<span style="font-size: 11.5px; letter-spacing: 0.1em; color: #A7ADB2">ALL SITES</span>
</div>
<div style="display: flex">
<button aria-pressed="{{all.on.pressed}}" onClick="{{all.setOn}}" style="min-width: 48px; min-height: 44px; padding: 0 10px; border: 1px solid {{all.on.border}}; border-radius: 0; background: {{all.on.bg}}; color: {{all.on.ink}}; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; cursor: pointer">ON</button>
<button aria-pressed="{{all.off.pressed}}" onClick="{{all.setOff}}" style="min-width: 48px; min-height: 44px; padding: 0 10px; border: 1px solid {{all.off.border}}; border-radius: 0; background: {{all.off.bg}}; color: {{all.off.ink}}; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; cursor: pointer">OFF</button>
</div>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 14px; border-top: 1px solid #1F2224">
<div style="min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 21px; font-weight: 600; letter-spacing: 0.06em">THIS SITE</span>
<span style="font-size: 11.5px; letter-spacing: 0.04em; color: #A7ADB2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">releases.example.org</span>
</div>
<div style="display: flex">
<button aria-pressed="{{site.on.pressed}}" onClick="{{site.setOn}}" style="min-width: 48px; min-height: 44px; padding: 0 10px; border: 1px solid {{site.on.border}}; border-radius: 0; background: {{site.on.bg}}; color: {{site.on.ink}}; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; cursor: pointer">ON</button>
<button aria-pressed="{{site.off.pressed}}" onClick="{{site.setOff}}" style="min-width: 48px; min-height: 44px; padding: 0 10px; border: 1px solid {{site.off.border}}; border-radius: 0; background: {{site.off.bg}}; color: {{site.off.ink}}; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; cursor: pointer">OFF</button>
</div>
</div>

<div style="display: flex; flex-direction: column; padding-top: 12px; border-top: 1px solid #2A2D30">
<span style="font-size: 11.5px; letter-spacing: 0.1em; color: #A7ADB2">SENT TO MBIRO TODAY</span>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 0; border-bottom: 1px solid #1F2224;">
<span style="font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">ubuntu-24.04.1-desktop-arm64.iso</span>
<span style="font-size: 11px; letter-spacing: 0.06em; color: #A7ADB2">2.9 GB · 62% · DOWNLOADING</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 0; border-bottom: 1px solid #1F2224;">
<span style="font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">node-v22.11.0.pkg</span>
<span style="font-size: 11px; letter-spacing: 0.06em; color: #A7ADB2">72 MB · DONE 10:42</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 0;">
<span style="font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">quarterly-report.pdf</span>
<span style="font-size: 11px; letter-spacing: 0.06em; color: #A7ADB2">4.2 MB · DONE 09:15</span>
</div>
</div>

<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 12px; border-top: 1px solid #2A2D30">
<button style="min-height: 44px; border: 1px solid #3C4044; border-radius: 2px; background: transparent; color: #F2F4F5; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; cursor: pointer">SETTINGS</button>
<button style="min-height: 44px; border: 0; border-radius: 2px; background: #C6F432; color: #0C0D0E; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.1em; cursor: pointer">OPEN MBIRO</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":340,"height":540}}'>
class Component extends DCLogic {
state = { all: true, site: true };

renderVals() {
const sw = (key) => {
const v = this.state[key];
const face = (active) => ({
pressed: active ? 'true' : 'false',
border: active ? '#C6F432' : '#3C4044',
bg: active ? '#C6F432' : 'transparent',
ink: active ? '#0C0D0E' : '#A7ADB2'
});
return {
on: face(v),
off: face(!v),
setOn: () => this.setState({ [key]: true }),
setOff: () => this.setState({ [key]: false })
};
};
return { all: sw('all'), site: sw('site') };
}
}
</script>
</body>
</html>
