<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu bar popover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
button{transition:background-color .15s ease,color .15s ease,border-color .15s ease}
a{color:#C6F432}a:hover{color:#E4FF8A}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.blink{animation:blink .9s steps(2,jump-none) infinite}
.drop{animation:drop .7s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){.blink,.drop{animation:none}button{transition:none}}
</style>
</helmet>
<div style="width: 360px; height: 476px; box-sizing: border-box; padding: 18px; display: flex; flex-direction: column; gap: 16px; background: #0C0D0E; color: #F2F4F5; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums">

<div style="display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 12px; border-bottom: 1px solid #2A2D30">
<span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.16em; color: {{accent}}">MBIRO</span>
<div class="drop" style="display: flex; align-items: baseline; gap: 8px">
<span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 58px; font-weight: 700; line-height: 0.86; color: {{accent}}">12.4</span>
<span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: 0.08em; color: #A7ADB2">MB/S</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid {{accent}}; border-radius: 2px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11.5px; letter-spacing: 0.1em; color: #A7ADB2">LINK COPIED</span>
<span style="font-size: 12.5px; overflow-wrap: anywhere">example.com/files/site-photos.zip</span>
</div>
<button style="min-height: 44px; border: 0; border-radius: 2px; background: {{accent}}; color: #0C0D0E; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.1em; cursor: pointer">DOWNLOAD THIS LINK</button>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 7px">
<div style="font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">ubuntu-24.04.1-desktop-arm64.iso</div>
<div aria-hidden="true" style="display: flex; gap: 2px">
<sc-for list="{{r1}}" as="s" hint-placeholder-count="28"><span class="{{s.cls}}" style="flex: 1 1 0; height: 16px; background: {{s.bg}}"></span></sc-for>
</div>
<div style="font-size: 11.5px; letter-spacing: 0.04em; color: #A7ADB2">62% · 8.1 MB/S · 02:15</div>
</div>
<div style="display: flex; flex-direction: column; gap: 7px">
<div style="font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Building reliable job queues (1080p).mp4</div>
<div aria-hidden="true" style="display: flex; gap: 2px">
<sc-for list="{{r2}}" as="s" hint-placeholder-count="28"><span class="{{s.cls}}" style="flex: 1 1 0; height: 16px; background: {{s.bg}}"></span></sc-for>
</div>
<div style="font-size: 11.5px; letter-spacing: 0.04em; color: #A7ADB2">43% · 4.3 MB/S · 01:35</div>
</div>
<div style="font-size: 11.5px; letter-spacing: 0.08em; color: #A7ADB2">1 PAUSED · 1 FAILED</div>
</div>

<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 14px; border-top: 1px solid #2A2D30">
<button style="min-height: 44px; border: 1px solid #3C4044; border-radius: 2px; background: transparent; color: #F2F4F5; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; cursor: pointer">PAUSE ALL</button>
<button style="min-height: 44px; border: 1px solid #3C4044; border-radius: 2px; background: transparent; color: #F2F4F5; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; cursor: pointer">OPEN WINDOW</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F432","options":["#C6F432","#4DE8FF","#FFB020","#FF7AD9"]},"$preview":{"width":360,"height":476}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#C6F432';
const seg = (pct) => {
const n = Math.round((pct / 100) * 28);
return Array.from({ length: 28 }, (_, i) => ({ bg: i < n ? accent : '#24272A', cls: i === n - 1 ? 'blink' : '' }));
};
return { accent: accent, r1: seg(62), r2: seg(43) };
}
}
</script>
</body>
</html>
