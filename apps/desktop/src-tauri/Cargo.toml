[package]
name = "mbiro-desktop"
description = "Mbiro desktop app: Rust core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "mbiro_desktop"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
mbiro-common = { path = "../../../crates/common" }
tauri = { version = "=2.12.7", features = ["tray-icon", "image-png"] }
# Tells the user when a download finishes.
tauri-plugin-notification = "=2.8.1"
# A second launch brings the running app forward instead of starting another.
tauri-plugin-single-instance = "=2.5.5"
# The folder picker in the add dialog.
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "net", "time", "sync", "macros", "rt-multi-thread", "io-util", "fs"] }
# JSON-RPC to aria2 on 127.0.0.1, and HTTPS fetches of the helper tools. TLS is
# the system's (Security.framework), so no TLS library is compiled in.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
# Checks every fetched tool against its pinned checksum before it is unpacked.
sha2 = "0.11.1"
url = "2"
# The job list. SQLite is compiled in, so its version is the one pinned here.
rusqlite = { version = "0.43.0", features = ["bundled"] }

[dev-dependencies]
# Tests read the job list directly to check what is stored.
rusqlite = { version = "0.43.0", features = ["bundled"] }
